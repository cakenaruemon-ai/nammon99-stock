<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151514">
<title>น้ำมนต์ 99 Stock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NM99 Stock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F3F3EF;--surface:#FFFFFF;--ink:#151514;--muted:#6B6B66;--line:#E4E4DE;--line2:#EFEFEA;--soft:#E9E9E3;--field:#FCFCFA;
  --blue:#1D4ED8;--blue-ink:#1D45B8;--blue-bg:#E6EDFD;--blue-mid:#4F7BEA;--blue-light:#93B0F5;
  --warn:#B45309;--warn-ink:#8A3A06;--warn-bg:#FDF0E1;--warn-line:#E7B98A;
  --purple-ink:#4C2F96;--purple-bg:#EFE9FB;--red:#A13A32;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.pad{padding:0 20px}
.hdr{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr .eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.hdr h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hdr2{padding:18px 20px 0;display:flex;align-items:center;gap:12px}
.hdr2 h1{margin:0;font-size:22px;font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;text-decoration:none;color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.search input{border:0;outline:none;flex:1;font-size:15px;background:transparent;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tile.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile .l{font-size:12px;color:var(--muted)}.tile.dark .l{color:#C9C9C2}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:13px;font-weight:500}
.tile .s{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.chip.sel{border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-ink);font-weight:600}
.chip.warn{background:var(--warn-bg);border-color:#F0D2B0;color:var(--warn-ink);font-weight:600}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;font-size:13px;text-decoration:none}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.purple{background:var(--purple-bg);color:var(--purple-ink)}
.banner.err{background:#FFF0EF;color:#8E312A;border:1px solid #F2C9C5}
.banner .grow{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.carcard{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);width:100%;text-align:left}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--soft);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bb{border-radius:12px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.03em;color:var(--ink);flex-shrink:0;line-height:1;text-align:center;padding:0 2px;overflow:hidden}
.brandrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 4px}
.brandrow::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}
.brandbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;font-size:11px;color:var(--muted);flex-shrink:0;min-width:56px}
.brandbtn .bb{width:52px;height:52px;border-radius:16px;font-size:10px}
.brandbtn.on .bb{border:2px solid var(--blue);color:var(--blue-ink);background:var(--blue-bg)}
.brandbtn.on{color:var(--ink);font-weight:600}
.brandbtn.zero{opacity:.45}
.carcard .bb{width:46px;height:46px;font-size:9.5px;align-self:center}
.bigsearch{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;background:#fff;border:1.5px solid #D6D6CF;border-radius:16px}
.bigsearch input{border:0;outline:none;flex:1;font-size:17px;background:transparent;min-width:0}
.bigsearch:focus-within{border-color:var(--blue)}
.sumcard{background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px}
.sumcard .typ{background:#2A2A27;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.logocell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);min-height:76px;justify-content:center}
.logocell.zero{opacity:.45}
.logocell img{width:58px;height:28px;object-fit:contain}
.logocell .ltxt{height:28px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.logocell .n{font-size:17px;font-weight:700;line-height:1.1;margin-top:2px}
.logocell .n small{font-size:12px;font-weight:500}
.logocell .s{font-size:10.5px;color:var(--muted);white-space:nowrap}
.blogo{width:52px;height:52px;object-fit:contain;flex-shrink:0}
.minilogo{width:40px;height:40px;object-fit:contain;flex-shrink:0;align-self:center}
.brandpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.brandpick button{height:60px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.brandpick button img{width:100%;height:100%;object-fit:contain}
.brandpick button.on{border:2px solid var(--blue);background:var(--blue-bg)}
.typepick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.typepick button{height:68px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.typepick button.on{border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-ink);font-weight:600}
.qgrid .fld input{font-weight:600}
.qgrid .fld.filled{background:#fff;border-color:#C9D6F8}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{flex-shrink:0;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap}
.pill.blue{background:var(--blue-bg);color:var(--blue-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.gray{background:#EDEDE8;color:var(--ink)}
.pill.dark{background:var(--ink);color:#fff}
.pill.purple{background:var(--purple-bg);color:var(--purple-ink)}
.figs{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;gap:6px}
.pos{color:var(--blue);font-weight:600}.neg{color:var(--red);font-weight:600}.wtxt{color:var(--warn);font-weight:600}.mut{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.card h3{margin:0;font-size:15px;font-weight:600}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
.big{font-size:34px;font-weight:700}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:13px}
.kv .k{color:var(--muted);font-size:12px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.plate{flex-shrink:0;border:2px solid var(--ink);border-radius:7px;background:#fff;padding:3px 9px;text-align:center}
.plate b{display:block;font-size:16px;line-height:1.1}.plate span{font-size:9px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{height:44px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:500}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.seg button.onblue{background:var(--blue);color:#fff;font-weight:600}
.btn{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid #D6D6CF;background:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{min-height:36px;font-size:13px;border-radius:10px;padding:0 12px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.fld{display:block;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:7px 12px}
.fld span{display:block;font-size:11px;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;border:0;outline:none;font-size:16px;padding:2px 0 0;background:transparent;resize:none;min-height:24px}
.fld.hero{border:2px solid var(--blue);border-radius:14px;padding:8px 14px;background:#fff}
.fld.hero input{font-size:28px;font-weight:700;padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lbl{font-size:12px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.5}
.empty{text-align:center;padding:34px 10px;color:var(--muted);font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding-top:8px;height:72px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;min-height:44px}
.nav a.on{color:var(--ink);font-weight:600}
.nav a.on svg{stroke:var(--ink)}
.fab{width:56px;height:56px;margin-top:-24px;border-radius:28px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(29,78,216,.35)}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:528px;margin:0 auto;display:flex;gap:8px}.actionbar .in>*{flex:1}
.photo{height:150px;background:#DADAD3;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#55554F;font-size:13px}
.photo .iconbtn{position:absolute;top:16px;border:0}
.steps{display:grid;gap:4px;font-size:11px}
.steps div{display:flex;flex-direction:column;gap:4px}
.steps i{height:5px;border-radius:3px;background:#DADAD3;display:block}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px}
.tl i{width:10px;height:10px;border-radius:5px;margin-top:5px;display:block}
.sched{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.sched:last-child{border-bottom:0}
.instrow{display:grid;grid-template-columns:48px 1fr 1fr 36px;gap:6px;align-items:center;font-size:13px}
.instrow input{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;min-height:40px}
.picklist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.picklist button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
/* sheets */
.sheetwrap{position:fixed;inset:0;z-index:50;background:rgba(20,20,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px 0;position:relative}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#CFCFC8;margin:0 auto}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.sheet .sh h2{margin:0;font-size:20px;font-weight:700}
.sheet .foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-top:14px;border-top:1px solid var(--line)}
.sheet .sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
@media(min-width:760px){.sheetwrap{align-items:center;padding:24px}.sheet{border-radius:26px;max-height:92vh}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;transition:.18s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.login{min-height:100vh;display:grid;place-items:center;padding:18px}
.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}
.loginbox h1{margin:0;font-size:24px}
.loginbox p{margin:4px 0 18px;color:var(--muted);font-size:13px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="sheets"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* ================= setup ================= */
const CFG=window.APP_CONFIG||{};
const configured=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase);
const sb=configured?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
let me=null,emp=null,booted=false,v2Missing=false,pendingRender=false;
const D={cars:[],expenses:[],vals:[],sales:[],customers:[],res:[],inst:[],pays:[],fups:[]};
const UI={brand:'',model:'',body:'',brandKey:'',stockQ:'',soldQ:'',soldFilter:'all',soldMonth:'',debtFilter:'open'};
const READY='พร้อมขาย',SOLD='ขายแล้ว';
const FINANCES=['TTB','Tisco','กรุงศรี','เกียรตินาคินภัทร'];
const SOURCES=['หน้าร้าน','Facebook','TikTok','คนรู้จักแนะนำ','อื่น ๆ'];
const EXP_TYPES=['ซ่อม','ยาง','ทำสี','ล้าง/เคลือบ','โอน/ภาษี','ค่าคอม','ขนส่ง','อื่น ๆ'];
const COLORS=['ขาว','ดำ','แดง','เทา','น้ำเงิน','เงิน','ฟ้า','เขียว','ครีม','บรอนซ์','น้ำตาล','ส้ม','เหลือง'];
const FU_RESULTS=['ไม่รับสาย','นัดจ่ายใหม่','ขอผ่อนเพิ่ม','ติดต่อไม่ได้','อื่น ๆ'];

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>(n===null||n===undefined||n===''||Number.isNaN(Number(n)))?'—':Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
const signed=n=>(n>0?'+':n<0?'−':'')+money(Math.abs(n));
const nDate=v=>{const m=String(v??'').trim().match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:null};
const pad2=n=>String(n).padStart(2,'0');
const isoLocal=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>isoLocal(new Date());
const addDays=(iso,n)=>{const d=new Date((nDate(iso)||today())+'T00:00:00');d.setDate(d.getDate()+n);return isoLocal(d)};
const addMonths=(iso,n)=>{const d=new Date((nDate(iso)||today())+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return isoLocal(d)};
const daysBetween=(a,b)=>Math.round((new Date(nDate(b)+'T00:00:00')-new Date(nDate(a)+'T00:00:00'))/86400000);
const fmtDate=v=>{const d=nDate(v);return d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'—'};
const fmtDay=v=>{const d=nDate(v);return d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'—'};
const monthKey=v=>(nDate(v)||'').slice(0,7);
const fmtMonth=k=>{if(!k)return '';const d=new Date(k+'-01T00:00:00');return d.toLocaleDateString('th-TH',{month:'short',year:'numeric'})};
const ageDays=v=>{const d=nDate(v);return d?Math.max(0,daysBetween(d,today())):null};
const num=v=>{const s=String(v??'').replace(/[,\s฿]/g,'');if(s==='')return null;const n=Number(s);return Number.isFinite(n)?n:null};
const val=id=>($(id)?.value??'').trim();
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f?f(x):x||0),0);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2400)}
function errMsg(e){return e?.message||String(e||'เกิดข้อผิดพลาด')}

/* ================= icons ================= */
const svg=(p,o={})=>`<svg width="${o.s||20}" height="${o.s||20}" viewBox="0 0 24 24" fill="none" stroke="${o.c||'currentColor'}" stroke-width="${o.w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const P={
 car:'<path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 5 5L20 7"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 back:'<path d="m15 18-6-6 6-6"/>',chev:'<path d="m9 18 6-6-6-6"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',

const isSold=c=>c.status===SOLD;
const carById=id=>D.cars.find(c=>c.id===id);
const saleById=id=>D.sales.find(s=>s.id===id);
const saleOfCar=id=>D.sales.find(s=>s.car_id===id);
const custById=id=>D.customers.find(c=>c.id===id);
const activeRes=carId=>D.res.find(r=>r.car_id===carId&&r.status==='active');
const expOf=carId=>D.expenses.filter(x=>x.car_id===carId);
const expTotal=carId=>sum(expOf(carId),x=>x.amount);
const costOf=c=>Number(c.purchase_price||0)+expTotal(c.id);
const carName=c=>c?[c.brand,c.model,c.trim].filter(Boolean).join(' '):'(ไม่พบรถ)';
const carShort=c=>c?[c.brand,c.model].filter(Boolean).join(' '):'(ไม่พบรถ)';
const saleProfit=s=>{const c=carById(s.car_id);return Number(s.sale_price||0)-(c?costOf(c):0)+Number(s.finance_commission||0)};
const payLabel=s=>s.payment_method==='cash'?'เงินสด':(s.finance_company||'ไฟแนนซ์');
function debtOf(s){
  const due=Number(s.customer_due||0);
  const pays=D.pays.filter(p=>p.sale_id===s.id).sort((a,b)=>(a.paid_date>b.paid_date?1:-1));
  const paid=sum(pays,p=>p.amount);
  const remaining=Math.max(0,Math.round((due-paid)*100)/100);
  const insts=D.inst.filter(i=>i.sale_id===s.id).sort((a,b)=>a.seq-b.seq);
  const initial=Math.max(0,due-sum(insts,i=>i.amount));
  let pool=paid-initial;const t=today();
  const rows=insts.map(i=>{const amt=Number(i.amount);const cover=Math.max(0,Math.min(amt,pool));pool-=amt;
    const left=amt-cover;const st=left<=0.009?'paid':(nDate(i.due_date)<t?'overdue':'upcoming');return {...i,amt,left,st}});
  const initialLeft=Math.max(0,initial-paid);
  const overdueRows=rows.filter(r=>r.st==='overdue');
  let overdueAmt=sum(overdueRows,r=>r.left);let firstOverdue=overdueRows[0]?.due_date||null;
  if(initialLeft>0.009){overdueAmt+=initialLeft;if(!firstOverdue||s.sale_date<firstOverdue)firstOverdue=s.sale_date}
  const next=rows.find(r=>r.st!=='paid')||null;
  const fups=D.fups.filter(f=>f.sale_id===s.id).sort((a,b)=>(a.created_at<b.created_at?1:-1));
  return {due,paid,remaining,pays,rows,initial,initialLeft,overdueAmt,overdueDays:firstOverdue&&remaining>0?Math.max(0,daysBetween(firstOverdue,t)):0,next,fups,lastFup:fups[0]||null,noSchedule:remaining>0&&!rows.some(r=>r.st!=='paid')&&initialLeft<=0.009};
}
const openDebts=()=>D.sales.filter(s=>Number(s.customer_due||0)>0&&debtOf(s).remaining>0.009);
function valOld(c){const t=today();return ['ttb','tisco'].some(k=>c[k+'_price']&&nDate(c[k+'_effective_date'])&&daysBetween(c[k+'_effective_date'],t)>30)}

async function login(){

async function boot(){
  if(!sb){renderLogin();return}

  if(!me){renderLogin();return}
  const {data:e,error:ee}=await sb.from('employees').select('*').eq('user_id',me.id).maybeSingle();

const TABLES=[['cars','cars','updated_at',false],['expenses','car_expenses','expense_date',false],['vals','valuation_history','effective_date',false],
 ['sales','sales','sale_date',true],['customers','customers','created_at',true],['res','reservations','created_at',true],
 ['inst','down_installments','due_date',true],['pays','down_payments','paid_date',true],['fups','debt_followups','created_at',true]];
async function reload(){
  const rs=await Promise.all(TABLES.map(([,t,o])=>sb.from(t).select('*').order(o,{ascending:false})));
  let missing=false;
  for(let i=0;i<TABLES.length;i++){
    const [k,t,,v2]=TABLES[i];const {data,error}=rs[i];
    if(error){
      if(v2){missing=true;D[k]=[];console.warn('ตาราง',t,'ยังไม่พร้อม:',error.message);continue}
      console.error(error);$('app').innerHTML=`<div class="pad" style="padding-top:30vh"><div class="banner err">โหลดข้อมูลไม่สำเร็จ: ${esc(error.message)}</div><button class="btn mt12" onclick="boot()" style="width:100%">ลองใหม่</button></div>`;return false;
    }
    D[k]=data||[];
  }
  v2Missing=missing;return true;
}

  ${showVal?valLine(c):''}</div></a>`;

function custBlock(cu){
  if(!cu)return '<div class="notice mt10">ไม่ได้บันทึกข้อมูลลูกค้า</div>';
  return `<div class="lrow mt10" style="border-top:1px solid var(--line2);border-bottom:0;padding-top:12px"><div class="grow"><div style="font-size:14px;font-weight:500">${esc(cu.full_name)}</div>
  <div class="meta">${[cu.phone,cu.line_id?'LINE: '+cu.line_id:null,cu.source?'มาจาก '+cu.source:null].filter(Boolean).map(esc).join(' · ')||'—'}</div>${cu.facebook?`<div class="meta">${esc(cu.facebook)}</div>`:''}</div>${contactBtns(cu)}</div>`;
}
function contactBtns(cu){
  if(!cu)return '';
  const tel=cu.phone?String(cu.phone).replace(/[^\d+]/g,''):'';
  return `${tel?`<a class="iconbtn" href="tel:${esc(tel)}" aria-label="โทรหาลูกค้า">${ic('phone',{s:18,w:1.8})}</a>`:''}${cu.line_id?`<a class="iconbtn" href="https://line.me/ti/p/~${encodeURIComponent(cu.line_id)}" target="_blank" rel="noopener" aria-label="ทัก LINE">${ic('chat',{s:18,w:1.8})}</a>`:''}`;
}
function saleDebtLine(s){
  if(!Number(s.customer_due))return '';
  const d=debtOf(s);
  if(d.remaining<=0.009)return `<div class="mt10 lbl" style="color:var(--blue)">${ic('check',{s:14,w:2.4})} ลูกค้าชำระครบ ${money(d.due)} แล้ว</div>`;
  return `<a class="banner ${d.overdueAmt>0?'warn':'purple'} mt12" href="#/debt/${s.id}">${ic(d.overdueAmt>0?'alert':'clock',{s:18})}<div class="grow">${s.payment_method==='cash'?'ค้างชำระ':'ค้างดาวน์'} <b>${money(d.remaining)}</b>${d.overdueAmt>0?' · เลยกำหนด '+d.overdueDays+' วัน':d.next?' · งวดหน้า '+fmtDay(d.next.due_date):''}</div><b>ติดตาม</b></a>`;
}

}

/* ================= views: sold ================= */
function viewSold(){
  if(!UI.soldMonth)UI.soldMonth=monthKey(today());
  const inMonth=D.sales.filter(s=>!UI.soldMonth||monthKey(s.sale_date)===UI.soldMonth);
  const rev=sum(inMonth,s=>s.sale_price),prof=sum(inMonth,saleProfit);
  const groups={};inMonth.forEach(s=>{const k=payLabel(s);groups[k]=(groups[k]||0)+1});
  const cols=['#151514','#1D4ED8','#4F7BEA','#93B0F5','#B45309','#9A9A93'];
  const gk=Object.keys(groups).sort((a,b)=>(a==='เงินสด'?-1:b==='เงินสด'?1:groups[b]-groups[a]));
  const debtCnt=openDebts().length;
  $('app').innerHTML=`
  <div class="hdr"><div><div class="eyebrow">น้ำมนต์ 99</div><h1>ประวัติการขาย</h1></div>
   <label class="chip" style="position:relative">${UI.soldMonth?fmtMonth(UI.soldMonth):'ทุกเดือน'}<input type="month" value="${UI.soldMonth}" onchange="UI.soldMonth=this.value;viewSold()" style="position:absolute;inset:0;opacity:0;width:100%" aria-label="เลือกเดือน"></label></div>
  <div class="pad"><label class="search">${ic('search',{s:18,c:'#6B6B66'})}<input id="soldQ" placeholder="ค้นหาชื่อลูกค้า เบอร์โทร หรือทะเบียน" value="${esc(UI.soldQ)}" oninput="UI.soldQ=this.value;drawSoldList()" aria-label="ค้นหาการขาย"></label></div>
  ${v2Banner()}
  <div class="pad mt12"><div class="card"><div class="tiles" style="gap:8px"><div><div class="lbl">ขายแล้ว</div><div style="font-size:20px;font-weight:700">${inMonth.length} คัน</div></div>
   <div><div class="lbl">ยอดขาย</div><div style="font-size:20px;font-weight:700">${shortMoney(rev)}</div></div>
   <div><div class="lbl">กำไรจริง</div><div style="font-size:20px;font-weight:700" class="${prof>=0?'pos':'neg'}">${prof>=0?'+':'−'}${shortMoney(Math.abs(prof))}</div></div></div>
   ${inMonth.length?`<div class="lbl mt14">ช่องทางชำระ</div><div class="bar mt6" style="gap:2px">${gk.map((k,i)=>`<span style="width:${groups[k]/inMonth.length*100}%;background:${cols[i%cols.length]}"></span>`).join('')}</div>
   <div class="legend mt8">${gk.map((k,i)=>`<span><i style="background:${cols[i%cols.length]}"></i>${esc(k)} ${groups[k]}</span>`).join('')}</div>`:''}
   <div class="row mt12"><button class="btn sm" onclick="UI.soldMonth='';viewSold()">ดูทุกเดือน</button></div></div></div>
  <div class="pad mt12 chips scroll" id="soldChips">${[['all','ทั้งหมด'],['cash','เงินสด'],['finance','ไฟแนนซ์']].map(([k,l])=>`<button class="chip ${UI.soldFilter===k?'on':''}" onclick="UI.soldFilter='${k}';viewSold()">${l}</button>`).join('')}
   <a class="chip warn" href="#/debts">ค้างดาวน์ ${debtCnt}</a></div>
  <div class="pad mt12"><div class="list" id="soldList"></div></div>${navBar('sold')}`;
  drawSoldList();
}
function drawSoldList(){
  const el=$('soldList');if(!el)return;const q=UI.soldQ.trim().toLowerCase().replace(/\s/g,'');
  let arr=D.sales.filter(s=>!UI.soldMonth||monthKey(s.sale_date)===UI.soldMonth);
  if(UI.soldFilter!=='all')arr=arr.filter(s=>s.payment_method===UI.soldFilter);
  if(q)arr=arr.filter(s=>{const c=carById(s.car_id)||{},cu=custById(s.customer_id)||{};return [c.brand,c.model,c.plate,cu.full_name,cu.phone,cu.line_id].join(' ').toLowerCase().replace(/\s/g,'').includes(q)});
  arr.sort((a,b)=>(a.sale_date<b.sale_date?1:-1));
  // รถที่สถานะขายแล้วแต่ไม่มีข้อมูลการขาย (ข้อมูลเก่าจากเวอร์ชันก่อน)
  const legacy=(!UI.soldFilter||UI.soldFilter==='all')&&!q?D.cars.filter(c=>isSold(c)&&!saleOfCar(c.id)&&(!UI.soldMonth||monthKey(c.sold_date||c.updated_at)===UI.soldMonth)):[];
  el.innerHTML=(arr.map(soldCard).join('')+legacy.map(c=>`<a class="carcard" href="#/car/${c.id}"><div class="grow"><div class="row"><div class="ttl">${esc(carName(c))}</div><span class="pill gray">ไม่มีข้อมูลการขาย</span></div><div class="meta">${esc(c.plate||'-')} · กดเพื่อบันทึกรายละเอียดการขาย</div></div></a>`).join(''))||'<div class="empty">ยังไม่มีการขายในช่วงนี้</div>';
}
function soldCard(s){
  const c=carById(s.car_id),cu=custById(s.customer_id),d=debtOf(s),pr=saleProfit(s);
  const owe=d.remaining>0.009&&d.due>0;
  const days=c&&c.purchase_date?daysBetween(c.purchase_date,s.sale_date):null;
  return `<div class="card" style="padding:14px"><a href="#/car/${s.car_id}" style="text-decoration:none;color:inherit;display:block">
  <div class="row" style="align-items:flex-start"><div class="grow"><div class="ttl">${esc(carName(c))}</div><div class="meta">${esc(c?.plate||'-')} · ขาย ${fmtDate(s.sale_date)}${days!==null&&days>=0?' · อยู่ในสต๊อก '+days+' วัน':''}</div></div>
  <span class="pill ${owe?'warn':s.payment_method==='cash'?'gray':'blue'}">${esc(payLabel(s))}${owe?(s.payment_method==='cash'?' · ค้างชำระ':' · ค้างดาวน์'):''}</span></div>
  <div class="figs" style="font-size:13px;margin-top:8px"><span>ขาย <b>${money(s.sale_price)}</b></span><span class="${pr>=0?'pos':'neg'}" style="font-weight:700">กำไร ${signed(pr)}</span></div></a>
  ${cu?`<div class="lrow mt10" style="border-top:1px solid var(--line2);border-bottom:0;padding:10px 0 0"><div class="grow"><div style="font-size:14px;font-weight:500">${esc(cu.full_name)}</div><div class="meta">${esc([cu.phone,cu.source?'มาจาก '+cu.source:null].filter(Boolean).join(' · '))}</div></div>${contactBtns(cu)}</div>`:''}
  ${owe?`<a class="meta mt8" style="display:block;color:var(--warn-ink);font-weight:600" href="#/debt/${s.id}">ค้าง ${money(d.remaining)}${d.overdueAmt>0?' · เลยกำหนด '+d.overdueDays+' วัน':''} ›</a>`:''}</div>`;
}

/* ================= views: debts ================= */
function viewDebts(){
  const withDue=D.sales.filter(s=>Number(s.customer_due||0)>0).map(s=>({s,d:debtOf(s)}));
  const open=withDue.filter(x=>x.d.remaining>0.009),over=open.filter(x=>x.d.overdueAmt>0),closed=withDue.filter(x=>x.d.remaining<=0.009);
  const mk=monthKey(today());const collected=sum(D.pays.filter(p=>monthKey(p.paid_date)===mk&&withDue.some(x=>x.s.id===p.sale_id)),p=>p.amount);
  const soon=open.filter(x=>x.d.next&&x.d.next.st==='upcoming'&&daysBetween(today(),x.d.next.due_date)<=7);
  const list=UI.debtFilter==='over'?over:UI.debtFilter==='closed'?closed:open;
  list.sort((a,b)=>(b.d.overdueDays-a.d.overdueDays)||((a.d.next?.due_date||'9')<(b.d.next?.due_date||'9')?-1:1));
  $('app').innerHTML=`
  <div class="hdr2"><a class="iconbtn" href="#/sold" aria-label="กลับ">${ic('back',{w:2.2})}</a><h1>ลูกค้าค้างดาวน์</h1></div>
  ${v2Banner()}
  <div class="pad mt16"><div class="card dark"><div class="lbl" style="color:#C9C9C2;font-size:13px">ยอดค้างทั้งหมด</div><div class="big">${money(sum(open,x=>x.d.remaining))}</div>
   <div class="tiles mt14" style="padding-top:14px;border-top:1px solid #3A3A37;gap:8px">
   <div><div style="font-size:12px;color:#F7B77A">เลยกำหนด</div><div style="font-size:17px;font-weight:700;color:#F7B77A">${money(sum(over,x=>x.d.overdueAmt))}</div></div>
   <div><div style="font-size:12px;color:#C9C9C2">ครบใน 7 วัน</div><div style="font-size:17px;font-weight:700">${money(sum(soon,x=>x.d.next.left))}</div></div>
   <div><div style="font-size:12px;color:#C9C9C2">เก็บได้เดือนนี้</div><div style="font-size:17px;font-weight:700;color:#A9C1FA">${money(collected)}</div></div></div></div></div>
  <div class="pad mt12 chips scroll"><button class="chip ${UI.debtFilter==='open'?'on':''}" onclick="UI.debtFilter='open';viewDebts()">ค้างอยู่ ${open.length}</button>
   <button class="chip ${UI.debtFilter==='over'?'on':'warn'}" onclick="UI.debtFilter='over';viewDebts()">เลยกำหนด ${over.length}</button>
   <button class="chip ${UI.debtFilter==='closed'?'on':''}" onclick="UI.debtFilter='closed';viewDebts()">ปิดยอดแล้ว ${closed.length}</button></div>
  <div class="pad mt12"><div class="list">${list.length?list.map(({s,d})=>debtCard(s,d)).join(''):'<div class="empty">ไม่มีรายการ</div>'}</div></div>
  <div class="pad mt12"><div class="notice">ลูกค้าจะเข้ารายการนี้อัตโนมัติเมื่อบันทึกการขายแล้วยังชำระไม่ครบ รายการที่ใกล้ถึงวันนัดหรือเลยกำหนดจะขึ้นเตือนที่หน้าสต๊อกและหน้าภาพรวม</div></div>
  ${navBar('sold')}`;
}
function debtCard(s,d){
  const c=carById(s.car_id),cu=custById(s.customer_id);const pct=d.due?Math.min(100,d.paid/d.due*100):0;
  const badge=d.remaining<=0.009?'<span class="pill blue">ชำระครบ</span>':d.overdueAmt>0?`<span class="pill warn" style="font-weight:700">เลย ${d.overdueDays} วัน</span>`:d.next?`<span class="pill gray">งวดหน้า ${fmtDay(d.next.due_date)}</span>`:'<span class="pill gray">ไม่มีวันนัด</span>';
  const f=d.lastFup;const due2=f&&f.next_followup_date&&nDate(f.next_followup_date)<=today()&&d.remaining>0;
  return `<a class="card" href="#/debt/${s.id}" style="display:block;padding:14px;text-decoration:none;color:inherit;${d.overdueAmt>0?'border:2px solid var(--warn-line)':''}">
  <div class="row" style="align-items:flex-start"><div class="grow"><div class="ttl">${esc(cu?.full_name||'ไม่ระบุชื่อ')} · ${esc(carShort(c))}</div><div class="meta">${esc(c?.plate||'-')} · ขาย ${fmtDay(s.sale_date)} · ${s.payment_method==='cash'?'ราคา':'ดาวน์'} ${money(d.due)}</div></div>${badge}</div>
  <div class="bar mt12" style="height:8px;background:${d.overdueAmt>0?'#F2DCC4':'var(--soft)'}"><span style="width:${pct.toFixed(1)}%;background:#151514"></span></div>
  <div class="figs" style="color:var(--muted)"><span>จ่ายแล้ว ${money(d.paid)}</span><span>ค้าง <b style="font-size:15px;color:${d.overdueAmt>0?'var(--warn-ink)':'var(--ink)'}">${money(d.remaining)}</b></span></div>
  ${f?`<div class="meta mt10" style="padding-top:10px;border-top:1px solid var(--line2)"><b style="color:var(--ink)">ล่าสุด ${fmtDay(f.created_at)}</b> · ${esc(f.result)}${f.note?' · '+esc(f.note):''}${due2?' · <span class="wtxt">ถึงวันตามแล้ว</span>':f.next_followup_date?' · ตามอีก '+fmtDay(f.next_followup_date):''}</div>`:''}
  </a>`;
}
function viewDebt(saleId){
  const s=saleById(saleId);

  const schedRow=(icon,col,title,sub,amt,cls='')=>`<div class="sched ${cls}">${ic(icon,{s:20,c:col,w:icon==='check'?2.4:2})}<div><div style="font-weight:${cls?'600':'500'}">${title}</div><div class="meta" style="${cls?'color:inherit':''}">${sub}</div></div><b>${money(amt)}</b></div>`;
  const rows=[];
  if(d.initial>0.009)rows.push(d.initialLeft>0.009?schedRow('alert','#B45309','วันขาย',fmtDate(s.sale_date)+' · ยังไม่ครบ ค้าง '+money(d.initialLeft),d.initial,'wtxt'):schedRow('check','#1D4ED8','วันขาย',fmtDate(s.sale_date)+' · รับแล้ว',d.initial));
  d.rows.forEach(r=>{
    if(r.st==='paid')rows.push(schedRow('check','#1D4ED8','งวด '+r.seq,'นัด '+fmtDate(r.due_date)+' · รับแล้ว',r.amt));

    else rows.push(schedRow('circle','#9A9A93','งวด '+r.seq,'นัด '+fmtDate(r.due_date)+(r.left<r.amt?' · ค้าง '+money(r.left):''),r.amt));
  });
  const hist=[...d.fups.map(f=>({t:f.created_at,kind:'f',x:f})),...d.pays.map(p=>({t:(p.paid_date||'')+'T23:59:59',kind:'p',x:p}))].sort((a,b)=>(a.t<b.t?1:-1));

  <div class="pad mt14"><div class="tiles">
   ${cu?.phone?`<a class="tile" style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;text-decoration:none;color:inherit" href="tel:${esc(String(cu.phone).replace(/[^\d+]/g,''))}">${ic('phone',{s:18,w:1.8})}โทร</a>`:`<div class="tile" style="text-align:center;font-size:12px;color:var(--muted)">ไม่มีเบอร์</div>`}
   ${cu?.line_id?`<a class="tile" style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;text-decoration:none;color:inherit" target="_blank" rel="noopener" href="https://line.me/ti/p/~${encodeURIComponent(cu.line_id)}">${ic('chat',{s:18,w:1.8})}LINE</a>`:`<div class="tile" style="text-align:center;font-size:12px;color:var(--muted)">ไม่มี LINE</div>`}
   <button class="tile" style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600" onclick="shareDebt('${s.id}')">${ic('share',{s:18,w:1.8})}ส่งยอดค้าง</button></div></div>
  <div class="pad"><div class="card mt10"><div class="row" style="align-items:baseline"><div class="lbl" style="font-size:13px">${s.payment_method==='cash'?'ยอดค้างชำระ':'ยอดค้างดาวน์'}</div><div style="font-size:28px;font-weight:700;color:${d.remaining>0?'var(--warn-ink)':'var(--blue)'}">${money(d.remaining)}</div></div>

   <div class="figs" style="color:var(--muted)"><span>จ่ายแล้ว ${money(d.paid)}</span><span>${s.payment_method==='cash'?'ราคาขาย':'ดาวน์ทั้งหมด'} ${money(d.due)}</span></div>

   <label class="fld mt8"><span>รายละเอียด</span><textarea id="fuNote" rows="2" placeholder="เช่น ลูกค้าแจ้งเงินเดือนออกวันที่ 5 จะโอนให้"></textarea></label>

   <div class="lbl mt16">ประวัติ</div>
   <div class="mt6">${hist.length?hist.map(h=>h.kind==='f'?`<div class="tl"><i style="background:${h.x.result==='นัดจ่ายใหม่'?'#1D4ED8':'#B45309'}"></i><div><div style="font-size:13px;font-weight:600">${fmtDay(h.x.created_at)} · ${esc(h.x.result)}${h.x.promised_date?' · นัดจ่าย '+fmtDay(h.x.promised_date):''}</div><div class="meta">${esc(h.x.note||'')}${h.x.next_followup_date?' · ตามอีก '+fmtDay(h.x.next_followup_date):''}</div></div></div>`:`<div class="tl"><i style="background:#151514"></i><div><div style="font-size:13px;font-weight:600">${fmtDay(h.x.paid_date)} · รับชำระ ${money(h.x.amount)}</div><div class="meta">${({cash:'เงินสด',transfer:'โอน',deposit:'หักจากมัดจำ'})[h.x.method]||''}${h.x.note?' · '+esc(h.x.note):''} <button class="chip" style="min-height:26px;padding:0 8px;font-size:11px;margin-left:4px" onclick="deletePayment('${h.x.id}','${s.id}')">ลบ</button></div></div></div>`).join(''):'<div class="meta">ยังไม่มีประวัติ</div>'}</div></div>
  </div>${navBar('sold')}`;

/* ================= views: overview ================= */
function viewOverview(){
  const ready=D.cars.filter(c=>!isSold(c));const t=today(),mk=monthKey(t);
  const cap=sum(ready,costOf),askT=sum(ready.filter(c=>c.asking_price),c=>c.asking_price),exp=sum(ready.filter(c=>c.asking_price),c=>Number(c.asking_price)-costOf(c));
  const soldM=D.sales.filter(s=>monthKey(s.sale_date)===mk);const bought=D.cars.filter(c=>monthKey(c.purchase_date)===mk).length;
  const ages=ready.map(c=>ageDays(c.purchase_date)).filter(x=>x!==null);const avg=ages.length?Math.round(sum(ages)/ages.length):0;
  const b=[[0,30,'0–30 วัน','#93B0F5'],[31,60,'31–60 วัน','#4F7BEA'],[61,90,'61–90 วัน','#1D4ED8'],[91,1e9,'90+ วัน','#B45309']].map(([lo,hi,l,col])=>({l,col,n:ages.filter(a=>a>=lo&&a<=hi).length}));
  const mx=Math.max(1,...b.map(x=>x.n));
  const todo=[];
  const od=openDebts().map(s=>({s,d:debtOf(s)})).filter(x=>x.d.overdueAmt>0);
  if(od.length)todo.push({href:'#/debts',w:1,t:'ลูกค้าค้างดาวน์เลยกำหนด '+money(sum(od,x=>x.d.overdueAmt)),s:od.length+' ราย'});
  openDebts().forEach(s=>{const d=debtOf(s);const f=d.lastFup;if(f&&f.next_followup_date&&nDate(f.next_followup_date)<=t)todo.push({href:'#/debt/'+s.id,w:1,t:'ถึงวันตามหนี้: '+(custById(s.customer_id)?.full_name||'ลูกค้า'),s:'ค้าง '+money(d.remaining)})});
  D.res.filter(r=>r.status==='active').forEach(r=>{const c=carById(r.car_id);if(!c)return;if(r.expire_date&&nDate(r.expire_date)<t)todo.push({href:'#/car/'+c.id,w:1,t:carShort(c)+' · '+(c.plate||''),s:'หมดเวลาจองแล้ว ('+fmtDay(r.expire_date)+')'});else if(r.pickup_date&&daysBetween(t,r.pickup_date)<=2&&daysBetween(t,r.pickup_date)>=0)todo.push({href:'#/car/'+c.id,w:0,t:carShort(c)+' · '+(c.plate||''),s:'ลูกค้านัดรับรถ '+fmtDay(r.pickup_date)})});
  ready.forEach(c=>{const a=ageDays(c.purchase_date);const nm=carShort(c)+' · '+(c.plate||'ไม่มีทะเบียน');
    if(a>90)todo.push({href:'#/car/'+c.id,w:1,t:nm,s:'ค้างสต๊อก '+a+' วัน · พิจารณาลดราคา'});
    if(valOld(c))todo.push({href:'#/car/'+c.id,w:1,t:nm,s:'ราคากลางเก่าเกิน 30 วัน'});
    if(!c.asking_price)todo.push({href:'#/car/'+c.id,w:0,t:nm,s:'ยังไม่ได้ตั้งราคาขาย'});});
  $('app').innerHTML=`
  <div class="hdr"><div><div class="eyebrow">น้ำมนต์ 99</div><h1>ภาพรวม</h1></div><span class="chip">${fmtMonth(mk)}</span></div>
  ${v2Banner()}
  <div class="pad mt6"><div class="card dark"><div class="lbl" style="color:#C9C9C2;font-size:13px">ทุนที่จมอยู่ในสต๊อก</div><div class="big">${money(cap)}</div>
   <div class="tiles two mt14" style="padding-top:14px;border-top:1px solid #3A3A37"><div><div style="font-size:12px;color:#C9C9C2">มูลค่าตั้งขายรวม</div><div style="font-size:17px;font-weight:700">${money(askT)}</div></div>
   <div><div style="font-size:12px;color:#C9C9C2">กำไรคาดการณ์</div><div style="font-size:17px;font-weight:700;color:#A9C1FA">${signed(exp)}</div></div></div></div></div>
  <div class="pad mt10"><div class="tiles two"><a class="tile" href="#/sold" style="text-decoration:none;color:inherit"><div class="l">ขายเดือนนี้</div><div class="v">${soldM.length} คัน</div><div class="s pos">กำไรจริง ${signed(sum(soldM,saleProfit))}</div></a>
   <div class="tile"><div class="l">ซื้อเข้าเดือนนี้</div><div class="v">${bought} คัน</div><div class="s">อายุสต๊อกเฉลี่ย ${avg} วัน</div></div></div></div>
  <div class="pad mt10"><div class="card"><h3>อายุสต๊อก</h3><div class="meta">จำนวนคันตามระยะเวลาที่อยู่ในสต๊อก</div>
   <div class="mt14" style="display:flex;flex-direction:column;gap:10px;font-size:13px">${b.map((x,i)=>`<div style="display:grid;grid-template-columns:70px 1fr 36px;align-items:center;gap:10px;${i===3?'color:var(--warn-ink);font-weight:600':''}"><span>${x.l}</span><span class="bar" style="height:14px;border-radius:4px"><span style="width:${(x.n/mx*100).toFixed(0)}%;background:${x.col};border-radius:4px"></span></span><b style="text-align:right">${x.n}</b></div>`).join('')}</div></div></div>
  <div class="pad mt10"><div class="card"><div class="row"><h3>ต้องจัดการ</h3>${todo.length?`<span class="pill warn">${todo.length} เรื่อง</span>`:''}</div>
   <div class="mt6">${todo.length?todo.sort((a,b)=>b.w-a.w).slice(0,40).map(x=>`<a class="lrow" href="${x.href}" style="text-decoration:none;color:inherit"><i style="width:8px;height:8px;border-radius:4px;background:${x.w?'#B45309':'#1D4ED8'};flex-shrink:0;display:block"></i><div class="grow"><div style="font-size:14px;font-weight:500">${esc(x.t)}</div><div class="meta">${esc(x.s)}</div></div>${ic('chev',{s:16,c:'#9A9A93',w:2.2})}</a>`).join(''):'<div class="empty" style="padding:14px">ไม่มีเรื่องค้าง</div>'}</div></div></div>
  ${navBar('overview')}`;
}

function exportCSV(kind){

    D.cars.filter(c=>!isSold(c)).forEach(c=>{const r=activeRes(c.id);rows.push([bodyOf(c),c.brand,c.model,c.trim,yearLabel(c),c.plate,c.color,c.mileage,c.vin,nDate(c.purchase_date),c.purchase_price,expTotal(c.id),costOf(c),c.asking_price,c.ttb_price,c.tisco_price,ageDays(c.purchase_date),r?r.amount:'',c.status])})}

    D.sales.slice().sort((a,b)=>(a.sale_date>b.sale_date?1:-1)).forEach(s=>{const c=carById(s.car_id)||{},cu=custById(s.customer_id)||{},d=debtOf(s);rows.push([s.sale_date,c.brand,c.model,c.plate,s.sale_price,c.id?costOf(c):'',s.finance_commission,saleProfit(s),payLabel(s),s.down_payment_total,s.finance_amount,s.installments_months,cu.full_name,cu.phone,cu.line_id,cu.source,d.due,d.paid,d.remaining])})}
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nm99-${kind==='stock'?'stock':'sales'}-${today()}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);

/* ================= sheets ================= */
function openSheet(title,body,foot,opts={}){
  const w=document.createElement('div');w.className='sheetwrap';w.id=opts.id||'';
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sh"><div class="grow"><h2>${esc(title)}</h2>${opts.sub?`<div class="meta" style="font-size:13px">${esc(opts.sub)}</div>`:''}</div><button class="iconbtn" onclick="closeSheet(this)" aria-label="ปิด">${ic('x',{s:18,w:2.2})}</button></div>${body}${foot?`<div class="foot">${foot}</div>`:'<div style="height:20px"></div>'}</div>`;
  w.addEventListener('click',e=>{if(e.target===w)closeSheet(w)});
  $('sheets').appendChild(w);return w;
}
function closeSheet(el){const w=el?.closest?el.closest('.sheetwrap'):el;(w||document.querySelector('#sheets .sheetwrap:last-child'))?.remove();if(!document.querySelector('.sheetwrap')&&pendingRender)render()}
function closeAllSheets(){$('sheets').innerHTML=''}
function pick(btn){const g=btn.parentElement;[...g.children].forEach(b=>b.classList.remove('on'));btn.classList.add('on');g.dataset.value=btn.dataset.v;if(g.dataset.onpick)window[g.dataset.onpick](btn.dataset.v)}
const gv=name=>document.querySelector(`[data-group="${name}"]`)?.dataset.value||'';
const chipGroup=(name,opts,sel,extra='')=>`<div class="chips mt6" data-group="${name}" data-value="${esc(sel||'')}" ${extra}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<button type="button" class="chip ${v===sel?'on':''}" data-v="${esc(v)}" onclick="pick(this)">${esc(l)}</button>`}).join('')}</div>`;
async function busy(btnId,fn){const b=$(btnId);if(b?.disabled)return;const t=b?.innerHTML;if(b){b.disabled=true;b.textContent='กำลังบันทึก…'}try{return await fn()}catch(e){console.error(e);toast('บันทึกไม่สำเร็จ: '+errMsg(e))}finally{if(b&&document.body.contains(b)){b.disabled=false;b.innerHTML=t}}}
async function audit(entity_id,action,summary){try{await sb.from('audit_log').insert({entity_type:'cars',entity_id,action,summary,actor:me.id})}catch(e){}}
async function afterSave(msg,hash){closeAllSheets();await refresh();if(hash&&location.hash!==hash)location.hash=hash;toast(msg)}

/* ---------- in-page dialogs (ใช้แทน confirm/prompt ของเบราว์เซอร์) ---------- */
function askConfirm(msg,ok='ยืนยัน'){return new Promise(res=>{let done=false;const w=openSheet('ยืนยัน',`<div class="notice mt12" style="font-size:15px;color:var(--ink);white-space:pre-line">${esc(msg)}</div>`,
  `<div class="btns"><button class="btn" data-a="0">ยกเลิก</button><button class="btn dark" data-a="1">${esc(ok)}</button></div>`);
  const fin=v=>{if(done)return;done=true;w.remove();res(v)};
  w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>fin(b.dataset.a==='1'));
  new MutationObserver((m,o)=>{if(!document.body.contains(w)){o.disconnect();fin(false)}}).observe($('sheets'),{childList:true})})}
function askPrompt(msg,def=''){return new Promise(res=>{let done=false;const w=openSheet('ระบุข้อมูล',`<div class="notice mt12" style="font-size:14px;color:var(--ink);white-space:pre-line">${esc(msg)}</div><label class="fld mt10"><span>หมายเหตุ</span><input id="askIn" value="${esc(def)}"></label>`,
  `<div class="btns"><button class="btn" data-a="0">ยกเลิก</button><button class="btn dark" data-a="1">ตกลง</button></div>`);
  const fin=v=>{if(done)return;done=true;w.remove();res(v)};
  w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>fin(b.dataset.a==='1'?w.querySelector('#askIn').value:null));
  new MutationObserver((m,o)=>{if(!document.body.contains(w)){o.disconnect();fin(null)}}).observe($('sheets'),{childList:true})})}

function readAmountAt(s,pos){
  const re=/\s*(?:(\d+(?:[.,]\d+)*)|(ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)|(สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)|([kK])(?![a-zA-Z]))/y;

const QE_EXP_RE=/(?:เพิ่ม\s*)?(ค่าซ่อมบำรุง|ค่าซ่อม|ค่าใช้จ่าย|ค่ายาง|ค่าทำสี|ค่าสี|ค่าโอน|ค่าภาษี|ค่าล้างรถ|ค่าล้าง|ค่าเคลือบ|ค่าขนส่ง|ค่าคอม)|เพิ่ม(?=\s*[\d๐-๙])/g;
const QE_EXP_TYPE={'ค่าซ่อมบำรุง':'ซ่อม','ค่าซ่อม':'ซ่อม','ค่ายาง':'ยาง','ค่าทำสี':'ทำสี','ค่าสี':'ทำสี','ค่าโอน':'โอน/ภาษี','ค่าภาษี':'โอน/ภาษี','ค่าล้างรถ':'ล้าง/เคลือบ','ค่าล้าง':'ล้าง/เคลือบ','ค่าเคลือบ':'ล้าง/เคลือบ','ค่าขนส่ง':'ขนส่ง','ค่าคอม':'ค่าคอม'};
const QE_LABEL={body_type:'ประเภท',brand:'ยี่ห้อ',model:'รุ่น',trim:'รุ่นย่อย',year:'ปี',reg_year:'ปีจดทะเบียน',plate:'ทะเบียน',color:'สี',mileage:'ไมล์',vin:'เลขตัวถัง',purchase_date:'วันที่ซื้อเข้า',purchase_price:'ราคาซื้อเข้า',asking_price:'ราคาตั้งขาย'};
function qeParse(raw){let text=thDigits(raw);const exps=[],cuts=[];const re=new RegExp(QE_EXP_RE.source,'g');let m;
  while((m=re.exec(text))){const r=readAmountAt(text,m.index+m[0].length);if(r&&r.value>0){exps.push({type:QE_EXP_TYPE[m[1]]||'อื่น ๆ',label:m[1]||'ค่าใช้จ่าย',amount:r.value});cuts.push([m.index,r.end]);re.lastIndex=r.end}}
  for(const [a,b] of cuts.reverse())text=text.slice(0,a)+' '+text.slice(b);
  const o=parseCarText(text,{edit:true});return {o,exps}}
function qePreview(){const raw=val('editText');const el=$('qePrev');if(!el)return;if(!raw){el.innerHTML='';return}const {o,exps}=qeParse(raw);
  const items=Object.entries(o).filter(([k])=>k!=='reg_year'||!o.year).map(([k,v])=>`${QE_LABEL[k]||k}: <b>${esc(['purchase_price','asking_price','mileage'].includes(k)?money(v):k==='purchase_date'?fmtDate(v):k==='year'?yearLabel(o):v)}</b>`);
  exps.forEach(x=>items.push(`เพิ่ม${x.label==='ค่าใช้จ่าย'?'ค่าใช้จ่าย':x.label} (${x.type}): <b>${money(x.amount)}</b>`));
  el.innerHTML=items.length?`<div class="notice">จะอัปเดต: ${items.join(' · ')}</div>`:'<div class="notice">ยังอ่านคำสั่งไม่ได้</div>'}
function applyQuickEdit(carId){return busy('qeSave',async()=>{
  const raw=val('editText');if(!raw){toast('กรอกข้อความก่อน');return}
  const {o,exps}=qeParse(raw);const patch={...o,updated_by:me.id};let changed=Object.keys(o).length>0;
  if(o.year&&!o.reg_year)patch.reg_year=null;
  if(exps.length){const e=await sb.from('car_expenses').insert(exps.map(x=>({car_id:carId,expense_type:x.type,amount:x.amount,expense_date:today(),note:'เพิ่มผ่านพิมพ์สั้น',created_by:me.id})));if(e.error)throw e.error;changed=true}
  if(!changed){toast('ยังอ่านคำสั่งนี้ไม่ได้');return}
  if(Object.keys(o).length){const {error}=await sb.from('cars').update(patch).eq('id',carId);if(error)throw error}
  await audit(carId,'quick_update','แก้ไขแบบพิมพ์สั้น');await afterSave('อัปเดตแล้ว');
})}

  openSheet(isEdit?'แก้ไขการขาย':'บันทึกการขาย',body,`<button class="btn primary" id="sSave" style="width:100%" onclick="saveSale()">${isEdit?'บันทึกการแก้ไข':'ยืนยันขาย · เปลี่ยนสถานะเป็นขายแล้ว'}</button>`,{sub:carName(c)+(c.plate?' · '+c.plate:'')+' · ทุน '+money(costOf(c))});
  insts.forEach(i=>instAdd(i.amount,i.due_date));
  saleCalc();
}
function saleMethod(){$('sFin').classList.toggle('hide',gv('sMethod')!=='finance');saleCalc()}
function saleFc(v){$('sFcOtherW').classList.toggle('hide',v!=='__other')}
function saleDue(){const price=num(val('sPrice'))||0;return gv('sMethod')==='finance'?(num(val('sDown'))||0):price}
function saleRemain(){const S=window.__sale;const paid=S.isEdit?S.paidSoFar:(S.deposit+(num(val('sPaid'))||0));return Math.max(0,saleDue()-paid)}
function saleCalc(fromDown){
  const S=window.__sale;if(!S)return;const price=num(val('sPrice'))||0;const fin=gv('sMethod')==='finance';
  if(fromDown&&fin){const fa=$('sFinAmt');if(fa&&!fa.dataset.touched&&price)fa.value=money(Math.max(0,price-(num(val('sDown'))||0)))}
  const pr=price-S.cost+(fin?(num(val('sComm'))||0):0);
  $('sProfit').innerHTML=price?`<span class="${pr>=0?'pos':'neg'}">กำไร ${signed(pr)}</span>`:'';
  $('sAskInfo').textContent=S.ask?`ตั้งขายไว้ ${money(S.ask)}${price&&price!==S.ask?' · '+(price<S.ask?'ลด ':'เพิ่ม ')+money(Math.abs(S.ask-price)):''}`:'';
  $('sDueLbl').textContent=fin?'เงินดาวน์':'ราคาขาย (เงินสด)';$('sDue').textContent=money(saleDue());
  const rem=saleRemain();$('sRemain').textContent=money(rem);
  $('sRemainBox').style.background=rem>0?'var(--warn-bg)':'var(--blue-bg)';$('sRemainBox').style.color=rem>0?'var(--warn-ink)':'var(--blue-ink)';
  $('sInstW').classList.toggle('hide',rem<=0&&!document.querySelector('#sInst .instrow'));
  instMsg();
}
function salePayAll(){const S=window.__sale;$('sPaid').value=money(Math.max(0,saleDue()-S.deposit));saleCalc()}
function instAdd(amount,date){
  const box=$('sInst');const n=box.children.length+1;
  const lastDate=[...box.querySelectorAll('input[type=date]')].pop()?.value;
  const d=document.createElement('div');d.className='instrow';
  d.innerHTML=`<span class="mut">งวด ${n}</span><input inputmode="decimal" placeholder="จำนวนเงิน" value="${amount!=null?money(amount):''}" oninput="instMsg()" aria-label="จำนวนเงินงวด ${n}"><input type="date" value="${nDate(date)||addMonths(lastDate||val('sDate')||today(),lastDate?1:0)||''}" aria-label="วันนัดจ่ายงวด ${n}"><button type="button" class="iconbtn" style="width:36px;height:36px" onclick="this.parentElement.remove();instRenum()" aria-label="ลบงวด">${ic('x',{s:14})}</button>`;
  if(!date&&!lastDate){d.querySelector('input[type=date]').value=addDays(val('sDate')||today(),15)}
  box.appendChild(d);$('sInstW').classList.remove('hide');instMsg();
}
function instRenum(){[...$('sInst').children].forEach((r,i)=>r.firstElementChild.textContent='งวด '+(i+1));instMsg()}
function instSplit(){const box=$('sInst');if(!box.children.length){instAdd();instAdd()}const rows=[...box.children];const rem=saleRemain();
  const each=Math.floor(rem/rows.length);rows.forEach((r,i)=>r.querySelector('input').value=money(i===rows.length-1?rem-each*(rows.length-1):each));instMsg()}
function instRead(){return [...document.querySelectorAll('#sInst .instrow')].map(r=>{const [a,d]=r.querySelectorAll('input');return {amount:num(a.value),due_date:nDate(d.value)}})}
function instMsg(){const el=$('sInstMsg');if(!el)return;const rows=instRead();const tot=sum(rows,r=>r.amount||0);const S=window.__sale;
  const target=S.isEdit?null:saleRemain();
  if(!rows.length){el.innerHTML=saleRemain()>0?'<span class="wtxt">ยังไม่ได้กำหนดวันนัดจ่ายส่วนที่ค้าง</span>':'';return}
  if(target!==null&&Math.abs(tot-target)>0.5)el.innerHTML=`<span class="wtxt">รวมงวด ${money(tot)} ไม่เท่ากับยอดค้าง ${money(target)}</span>`;
  else if(S.isEdit&&tot>saleDue()+0.5)el.innerHTML=`<span class="wtxt">รวมงวด ${money(tot)} มากกว่ายอดที่ต้องจ่าย ${money(saleDue())}</span>`;
  else el.innerHTML=`รวม ${rows.length} งวด ${money(tot)}`;
}
function saveSale(){return busy('sSave',async()=>{
  const S=window.__sale;const price=num(val('sPrice'));const method=gv('sMethod');
  if(!price||price<=0){toast('กรอกราคาขาย');return}
  let fc=null;if(method==='finance'){fc=gv('sFc');if(fc==='__other')fc=val('sFcOther');if(!fc){toast('เลือกไฟแนนซ์');return}}
  const down=method==='finance'?(num(val('sDown'))||0):0;
  if(method==='finance'&&down>price){toast('เงินดาวน์มากกว่าราคาขาย');return}
  const rows=instRead();if(rows.some(r=>!r.amount||r.amount<=0||!r.due_date)){toast('กรอกจำนวนเงินและวันที่ให้ครบทุกงวด');return}
  const tot=sum(rows,r=>r.amount);
  if(!S.isEdit){const rem=saleRemain();if(rows.length&&Math.abs(tot-rem)>0.5){toast('ยอดรวมงวดต้องเท่ากับยอดคงค้าง '+money(rem));return}
    if(rem>0&&!rows.length&&!await askConfirm(`ยังค้าง ${money(rem)} แต่ยังไม่ได้กำหนดวันนัดจ่าย ต้องการบันทึกต่อหรือไม่?`))return;
    const paid=num(val('sPaid'))||0;if(S.deposit+paid>saleDue()+0.5&&!await askConfirm('ยอดที่รับมากกว่ายอดที่ลูกค้าต้องจ่าย ต้องการบันทึกต่อหรือไม่?'))return}
  else if(tot>saleDue()+0.5){toast('ยอดรวมงวดมากกว่ายอดที่ลูกค้าต้องจ่าย');return}
  const cu=readCust('sc');
  const p={car_id:S.carId,customer:cu,sale_price:price,sale_date:nDate(val('sDate'))||today(),payment_method:method,finance_company:fc,down_payment_total:down,
    finance_amount:method==='finance'?num(val('sFinAmt')):null,installments_months:method==='finance'?num(val('sMonths')):null,finance_commission:method==='finance'?num(val('sComm')):null,
    note:val('sNote'),paid_today:S.isEdit?0:(num(val('sPaid'))||0),paid_method:gv('sPaidM')||'cash',installments:rows};
  const {data,error}=await sb.rpc('record_sale',{p});if(error)throw error;
  await afterSave(S.isEdit?'บันทึกการแก้ไขแล้ว':'บันทึกการขายแล้ว','#/car/'+S.carId);
})}
async function cancelSale(saleId){
  if(!saleId){toast('ไม่พบข้อมูลการขาย');return}
  const s=saleById(saleId);const d=debtOf(s);
  if(!await askConfirm(`ยกเลิกการขายและคืนสถานะรถเป็น "พร้อมขาย"?\nข้อมูลการขาย การรับชำระ ${money(d.paid)} บาท และบันทึกการติดตามของคันนี้จะถูกลบ`))return;
  const {error}=await sb.rpc('cancel_sale',{p_sale_id:saleId});if(error){toast('ยกเลิกไม่สำเร็จ: '+error.message);return}
  await afterSave('ยกเลิกการขายแล้ว','#/car/'+s.car_id);
}

function savePayment(saleId){return busy('pSave',async()=>{

function saveReschedule(saleId){return busy('rsSave',async()=>{

function saveFollowup(saleId){return busy('fuSave',async()=>{
  const result=gv('fuResult');if(!result){toast('เลือกผลการติดต่อ');return}
  const promised=nDate(val('fuPromise')),next=nDate(val('fuNext'));const s=saleById(saleId),d=debtOf(s);

async function shareDebt(saleId){
  const s=saleById(saleId),d=debtOf(s),c=carById(s.car_id),cu=custById(s.customer_id);
  const lines=[`เรียน ${cu?.full_name||'ลูกค้า'}`,`รถ ${carName(c)} ทะเบียน ${c?.plate||'-'}`,`${s.payment_method==='cash'?'ยอดที่ต้องชำระ':'เงินดาวน์'} ${money(d.due)} บาท`,`ชำระแล้ว ${money(d.paid)} บาท`,`คงค้าง ${money(d.remaining)} บาท`];
  d.rows.filter(r=>r.st!=='paid').forEach(r=>lines.push(`• งวด ${r.seq} ${money(r.left)} บาท นัดชำระ ${fmtDate(r.due_date)}${r.st==='overdue'?' (เลยกำหนด)':''}`));
  lines.push('ขอบคุณครับ/ค่ะ — น้ำมนต์ 99');const text=lines.join('\n');
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e?.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('คัดลอกข้อความแล้ว นำไปวางใน LINE ได้เลย')}catch(e){showCopy(text)}
}

/* ================= install as app ================= */
let installEvt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(me&&booted&&!document.querySelector('.sheetwrap'))render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('ติดตั้งแอปแล้ว เปิดได้จากหน้าจอโฮม');if(me)render()});
function canInstall(){return !isStandalone()&&(installEvt||isIOS())}
function installDismissed(){try{return localStorage.getItem('nm99-install-hide')==='1'}catch(e){return false}}
function hideInstall(){try{localStorage.setItem('nm99-install-hide','1')}catch(e){}render()}
function installBanner(){
  if(!canInstall()||installDismissed())return '';
  return `<div class="pad mt12"><div class="banner" style="background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 8px 8px 14px">${ic('download',{s:18})}<div class="grow" style="font-size:13px"><b>ติดตั้งแอปลงมือถือ</b></div><button class="btn sm dark" style="min-height:36px" onclick="installApp()">ติดตั้ง</button><button class="iconbtn" style="width:32px;height:32px;border:0" onclick="hideInstall()" aria-label="ซ่อน">${ic('x',{s:14})}</button></div></div>`;
}
async function installApp(){
  if(installEvt){installEvt.prompt();const r=await installEvt.userChoice.catch(()=>null);installEvt=null;if(r?.outcome!=='accepted')render();return}
  openSheet('ติดตั้งแอปบน iPhone / iPad',`<div class="sec"><ol style="margin:0;padding-left:20px;line-height:2;font-size:15px">
  <li>เปิดหน้านี้ด้วย <b>Safari</b></li><li>กดปุ่ม <b>แชร์</b> ${ic('share',{s:16})} ด้านล่างจอ</li><li>เลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b> (Add to Home Screen)</li><li>กด <b>"เพิ่ม"</b> แล้วเปิดแอปจากไอคอน NM99 Stock</li></ol></div>
  <div class="notice mt10">Android: เปิดด้วย Chrome แล้วกดเมนู ⋮ → "ติดตั้งแอป" หรือ "เพิ่มไปยังหน้าจอหลัก"</div>`,'');
}

/* ================= start ================= */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;emp=null;booted=false;renderLogin()}});boot()}else renderLogin();
</script>
</body>

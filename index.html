<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111110">
<title>น้ำมนต์ 99 Stock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f5f5f2;--surface:#fff;--ink:#171716;--muted:#74746f;--line:#e6e6e0;
  --soft:#f0f0ec;--green:#236b48;--red:#a13a32;--shadow:0 12px 34px rgba(22,22,20,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.container{width:min(980px,100%);margin:auto;padding:14px 12px 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.title{font-size:20px;font-weight:850;letter-spacing:-.02em}
.subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:10px 13px;font-weight:750}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.small{font-size:12px;padding:8px 10px}
.btn.ghost{background:#fff}
.btn.danger{color:var(--red)}
.editorHead{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.carTitle{font-size:22px;font-weight:900;line-height:1.2}
.carMeta{color:var(--muted);font-size:13px;margin-top:4px}
.statusPill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750;margin-top:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sectionTitle strong{font-size:15px}
.sectionHint{font-size:11px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:11px;color:#666}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:#b8b8b1;box-shadow:0 0 0 3px #f0f0ec}
input[type=number]{font-variant-numeric:tabular-nums}
.moneyRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.moneyCard{border:1px solid var(--line);border-radius:15px;padding:11px;background:linear-gradient(#fff,#fafaf7)}
.moneyLabel{font-size:11px;color:var(--muted)}
.moneyValue{font-size:18px;font-weight:900;margin-top:3px}
.moneySub{font-size:11px;color:var(--muted);margin-top:3px}
.accordion{display:flex;flex-direction:column;gap:8px}
details{border:1px solid var(--line);border-radius:14px;background:#fff}
summary{list-style:none;padding:12px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--muted);font-size:18px;font-weight:400}
details[open] summary:after{content:"−"}
.detailBody{padding:0 13px 13px}
.notice{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12px;color:#555;margin-bottom:10px}
.notice.error{background:#fff0ef;color:#8e312a}
.costSummary{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.costSummary span{font-size:12px;color:var(--muted)}
.costSummary b{font-size:20px}
.bottomBar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px;z-index:30}
.bottomInner{width:min(980px,100%);margin:auto;display:flex;gap:8px}
.bottomInner .btn{flex:1}
.listCard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:8px}
.listMain{min-width:0}
.listName{font-weight:850}
.listMeta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listSide{text-align:right;flex:none}
.listPrice{font-weight:850;font-size:13px;margin-top:5px}
.search{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;margin-bottom:12px}
.empty{text-align:center;padding:38px 10px;color:var(--muted);font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:18px}
.loginBox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px;box-shadow:var(--shadow)}
.loginBox h1{margin:0;font-size:24px}
.loginBox p{margin:4px 0 18px;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#171716;color:#fff;padding:10px 13px;border-radius:12px;font-size:12px;transition:.18s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.container{padding:22px 16px 110px}.editorLayout{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.fullSection{grid-column:1/-1}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.moneyRow{grid-template-columns:1fr 1fr}.carTitle{font-size:19px}.container{padding-left:10px;padding-right:10px}.section{padding:12px}.bottomInner .btn{padding:11px 9px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<script>
const CFG=window.APP_CONFIG||{};
const configured=CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase;
const sb=configured?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
let me=null, emp=null, cars=[], expenses=[], histories=[], editingId=null;

const statuses=['รอตรวจสภาพ','กำลังซ่อม','เตรียมรถ','พร้อมขาย','จองแล้ว','ขายแล้ว','ยกเลิก'];
const money=n=>(n===null||n===undefined||n==='')?'—':Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}):'ยังไม่ระบุ';
const nDate=v=>v?String(v):null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),1900)}
function age(d){if(!d)return '-';return Math.max(0,Math.floor((Date.now()-new Date(d+'T00:00:00'))/86400000))}
function totalExp(id){return expenses.filter(x=>x.car_id===id).reduce((a,x)=>a+Number(x.amount||0),0)}
function currentCost(c){return Number(c.purchase_price||0)+totalExp(c.id)}
function byId(id){return cars.find(c=>c.id===id)}

function renderLogin(msg=''){
 document.getElementById('app').innerHTML=`<div class="login"><div class="loginBox">
 <h1>น้ำมนต์ 99 Stock</h1><p>ระบบสต๊อกรถสำหรับทีมงานภายใน</p>
 ${msg?`<div class="notice error">${esc(msg)}</div>`:''}
 ${!configured?`<div class="notice error">ยังไม่ได้เชื่อม Supabase กรุณาตรวจสอบ <b>config.js</b></div>`:''}
 <div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="username"></div>
 <div class="field" style="margin-top:10px"><label>รหัสผ่าน</label><input id="pass" type="password" autocomplete="current-password"></div>
 <button class="btn primary" style="width:100%;margin-top:13px" onclick="login()">เข้าสู่ระบบ</button>
 </div></div>`;
}
async function login(){
 if(!sb){toast('ยังไม่ได้เชื่อม Supabase');return}
 const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value});
 if(error){renderLogin(error.message);return}
 await boot();
}
async function boot(){
 if(!sb){renderLogin();return}
 const {data:u}=await sb.auth.getUser(); me=u?.user||null;
 if(!me){renderLogin();return}
 const {data:e,error:ee}=await sb.from('employees').select('*').eq('user_id',me.id).maybeSingle();
 if(ee||!e?.active){await sb.auth.signOut();renderLogin('บัญชีนี้ยังไม่ได้รับสิทธิ์เข้าใช้งาน');return}
 emp=e;
 await reload();
}
async function reload(){
 const [{data:c,error:ce},{data:x,error:xe},{data:h,error:he}]=await Promise.all([
  sb.from('cars').select('*').order('updated_at',{ascending:false}),
  sb.from('car_expenses').select('*').order('expense_date',{ascending:false}),
  sb.from('valuation_history').select('*').order('effective_date',{ascending:false})
 ]);
 if(ce||xe||he){toast('โหลดข้อมูลไม่สำเร็จ');console.error(ce||xe||he);return}
 cars=c||[];expenses=x||[];histories=h||[];
 renderHome();
}
function renderHome(){
 const active=cars.filter(c=>!['ขายแล้ว','ยกเลิก'].includes(c.status));
 const ready=active.filter(c=>c.status==='พร้อมขาย');
 const list=active.slice(0,30);
 document.getElementById('app').innerHTML=`<div class="container">
 <div class="topbar"><div><div class="title">น้ำมนต์ 99 STOCK</div><div class="subtitle">${esc(emp?.display_name||me?.email||'')}</div></div><button class="btn small" onclick="logout()">ออก</button></div>
 <div class="search"><input id="search" placeholder="ค้นหาทะเบียน / รุ่น / ยี่ห้อ / สี / VIN" oninput="drawHome()"></div>
 <div class="grid" style="margin-bottom:10px">
   <div class="moneyCard"><div class="moneyLabel">รถในสต๊อก</div><div class="moneyValue">${active.length}</div><div class="moneySub">พร้อมขาย ${ready.length} คัน</div></div>
   <div class="moneyCard"><div class="moneyLabel">ต้นทุนที่บันทึก</div><div class="moneyValue">${money(active.reduce((s,c)=>s+currentCost(c),0))}</div><div class="moneySub">เฉพาะรถที่ยังไม่ขาย</div></div>
 </div>
 <div class="section"><div class="sectionTitle"><strong>รถล่าสุด</strong><span class="sectionHint">แตะเพื่อเปิดรายละเอียด</span></div><div id="homeList"></div></div>
 </div>
 <div class="bottomBar"><div class="bottomInner"><button class="btn ghost" onclick="openQuick()">⌨️ เพิ่มแบบสั้น</button><button class="btn ghost" onclick="voiceInput()">🎙️ พูด</button><button class="btn primary" onclick="openEditor()">＋ เพิ่มรถ</button></div></div>`;
 drawHome();
}
function drawHome(){
 const q=(document.getElementById('search')?.value||'').trim().toLowerCase();
 const arr=cars.filter(c=>!['ขายแล้ว','ยกเลิก'].includes(c.status)).filter(c=>!q||[c.brand,c.model,c.trim,c.plate,c.color,c.vin,String(c.year||'')].join(' ').toLowerCase().includes(q)).slice(0,40);
 const el=document.getElementById('homeList'); if(!el)return;
 el.innerHTML=arr.length?arr.map(c=>`<button class="listCard" style="width:100%;text-align:left" onclick="openDetail('${c.id}')"><div class="listMain"><div class="listName">${esc(c.brand)} ${esc(c.model)}${c.trim?' '+esc(c.trim):''}</div><div class="listMeta">${esc(c.plate||'ไม่มีทะเบียน')} • ${esc(c.year||'-')} • ${esc(c.color||'-')}</div></div><div class="listSide"><div class="statusPill">${esc(c.status)}</div><div class="listPrice">ซื้อ ${money(c.purchase_price)}</div><div class="listMeta">${age(c.purchase_date)} วัน</div></div></button>`).join(''):'<div class="empty">ไม่พบรถ</div>';
}
function closeEditor(){document.getElementById('editor')?.remove()}
function openEditor(car={}){editingId=car.id||null; showEditor(car)}
function openDetail(id){
 const c=byId(id); if(!c)return;
 editingId=id;
 const ex=expenses.filter(x=>x.car_id===id), hist=histories.filter(x=>x.car_id===id);
 document.getElementById('app').innerHTML=`<div class="container">
 <div class="topbar"><button class="btn small" onclick="renderHome()">← กลับ</button><div class="toolbar"><button class="btn small" onclick="showEditor(byId('${id}'))">✏️ แก้ไข</button><button class="btn small" onclick="openQuickEdit('${id}')">⌨️ Quick</button></div></div>
 <div class="editorHead"><div class="carTitle">${esc(c.brand)} ${esc(c.model)}${c.trim?' '+esc(c.trim):''}</div><div class="carMeta">${esc(c.plate||'ไม่มีทะเบียน')} • ${esc(c.year||'-')} • ${esc(c.color||'-')}</div><div class="statusPill">${esc(c.status)}</div></div>
 <div class="grid">
   <div class="moneyCard"><div class="moneyLabel">ราคาซื้อเข้า</div><div class="moneyValue">${money(c.purchase_price)}</div><div class="moneySub">${fmtDate(c.purchase_date)}</div></div>
   <div class="moneyCard"><div class="moneyLabel">ค่าใช้จ่ายสะสม</div><div class="moneyValue">${money(totalExp(id))}</div><div class="moneySub">${ex.length} รายการ</div></div>
   <div class="moneyCard"><div class="moneyLabel">ต้นทุนที่บันทึก</div><div class="moneyValue">${money(currentCost(c))}</div><div class="moneySub">ซื้อเข้า + ค่าใช้จ่าย</div></div>
   <div class="moneyCard"><div class="moneyLabel">ราคาตั้งขาย</div><div class="moneyValue">${money(c.asking_price)}</div><div class="moneySub">อายุสต๊อก ${age(c.purchase_date)} วัน</div></div>
 </div>
 <div class="accordion" style="margin-top:10px">
   <details open><summary>ข้อมูลรถ</summary><div class="detailBody"><div class="grid" style="margin-top:5px">
    <div><b>ยี่ห้อ / รุ่น</b><br>${esc(c.brand)} ${esc(c.model)} ${esc(c.trim||'')}</div><div><b>ทะเบียน</b><br>${esc(c.plate||'-')}</div>
    <div><b>เลขตัวถัง</b><br>${esc(c.vin||'-')}</div><div><b>เลขไมล์</b><br>${c.mileage?money(c.mileage):'-'}</div>
    <div><b>วันที่ซื้อเข้า</b><br>${fmtDate(c.purchase_date)}</div><div><b>สถานะ</b><br>${esc(c.status)}</div>
   </div></div></details>
   <details><summary>ราคากลาง TTB / Tisco</summary><div class="detailBody"><div class="moneyRow">
      <div class="moneyCard"><div class="moneyLabel">TTB</div><div class="moneyValue">${money(c.ttb_price)}</div><div class="moneySub">ข้อมูล ณ ${fmtDate(c.ttb_effective_date)}</div></div>
      <div class="moneyCard"><div class="moneyLabel">Tisco</div><div class="moneyValue">${money(c.tisco_price)}</div><div class="moneySub">ข้อมูล ณ ${fmtDate(c.tisco_effective_date)}</div></div>
   </div></div></details>
   <details><summary>ค่าใช้จ่าย</summary><div class="detailBody">${ex.length?ex.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(x.expense_type)}</b><div class="muted">${fmtDate(x.expense_date)}${x.note?' • '+esc(x.note):''}</div></div><div style="font-weight:850">${money(x.amount)}</div></div>`).join(''):'<div class="empty">ยังไม่มีค่าใช้จ่าย</div>'}<button class="btn small" style="margin-top:10px" onclick="addExpense('${id}')">＋ เพิ่มค่าใช้จ่าย</button></div></details>
   <details><summary>ประวัติราคากลาง</summary><div class="detailBody">${hist.length?hist.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(x.institution)} • ${fmtDate(x.effective_date)}</span><b>${money(x.price)}</b></div>`).join(''):'<div class="empty">ยังไม่มีประวัติ</div>'}</div></details>
   <details><summary>หมายเหตุ</summary><div class="detailBody"><div class="notice">${esc(c.notes||'ไม่มี')}</div></div></details>
 </div>
 </div>
 <div class="bottomBar"><div class="bottomInner"><button class="btn ghost" onclick="editValuation('${id}')">✏️ ราคากลาง</button><button class="btn primary" onclick="showEditor(byId('${id}'))">แก้ไขข้อมูลรถ</button></div></div>`;
}
function showEditor(c={}){
 document.getElementById('editor')?.remove();
 const m=document.createElement('div');m.id='editor';m.className='modal';m.innerHTML=`<div class="sheet" style="width:100%;max-width:860px;max-height:94vh;overflow:auto;background:var(--bg);padding:0">
   <div style="position:sticky;top:0;z-index:2;background:rgba(245,245,242,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
     <div><b>${c.id?'แก้ไขข้อมูลรถ':'เพิ่มรถ'}</b><div class="subtitle">${c.id?esc(c.brand+' '+c.model):'กรอกเฉพาะข้อมูลที่มี ระบบไม่บังคับทุกช่อง'}</div></div>
     <button class="btn small" onclick="closeEditor()">×</button>
   </div>
   <div class="container" style="padding-top:12px">
     <div class="editorLayout">
       <div>
         <div class="section"><div class="sectionTitle"><strong>ข้อมูลหลัก</strong><span class="sectionHint">จำเป็น: ยี่ห้อ + รุ่น</span></div><div class="grid">
           <div class="field"><label>ยี่ห้อ *</label><input id="f_brand" value="${esc(c.brand||'')}"></div>
           <div class="field"><label>รุ่น *</label><input id="f_model" value="${esc(c.model||'')}"></div>
           <div class="field"><label>รุ่นย่อย</label><input id="f_trim" value="${esc(c.trim||'')}"></div>
           <div class="field"><label>ปี</label><input id="f_year" inputmode="numeric" placeholder="เช่น 2022" value="${esc(c.year||'')}"></div>
           <div class="field"><label>ทะเบียน</label><input id="f_plate" value="${esc(c.plate||'')}"></div>
           <div class="field"><label>สี</label><input id="f_color" value="${esc(c.color||'')}"></div>
           <div class="field"><label>เลขตัวถัง (VIN)</label><input id="f_vin" value="${esc(c.vin||'')}"></div>
           <div class="field"><label>เลขไมล์</label><input id="f_mileage" inputmode="numeric" value="${esc(c.mileage||'')}"></div>
         </div></div>
         <div class="section"><div class="sectionTitle"><strong>การซื้อเข้า</strong><span class="sectionHint">ต้นทุนเริ่มต้น</span></div><div class="grid">
           <div class="field"><label>วันที่ซื้อเข้า</label><input id="f_purchase_date" type="date" value="${esc(c.purchase_date||'')}"></div>
           <div class="field"><label>ราคาซื้อเข้า</label><input id="f_purchase_price" inputmode="decimal" value="${esc(c.purchase_price??'')}"></div>
         </div></div>
         <div class="section"><div class="sectionTitle"><strong>ราคากลาง</strong><span class="sectionHint">กรอกเอง + วันที่ข้อมูล</span></div><div class="moneyRow">
           <div class="moneyCard"><div class="moneyLabel">TTB</div><div class="field" style="margin-top:6px"><input id="f_ttb" inputmode="decimal" placeholder="เช่น 420000" value="${esc(c.ttb_price??'')}"></div><div class="field" style="margin-top:7px"><label>ข้อมูล ณ วันที่</label><input id="f_ttb_date" type="date" value="${esc(c.ttb_effective_date||'')}"></div></div>
           <div class="moneyCard"><div class="moneyLabel">Tisco</div><div class="field" style="margin-top:6px"><input id="f_tisco" inputmode="decimal" placeholder="เช่น 415000" value="${esc(c.tisco_price??'')}"></div><div class="field" style="margin-top:7px"><label>ข้อมูล ณ วันที่</label><input id="f_tisco_date" type="date" value="${esc(c.tisco_effective_date||'')}"></div></div>
         </div></div>
       </div>
       <div>
         <div class="section"><div class="sectionTitle"><strong>การขาย</strong></div><div class="grid">
           <div class="field"><label>ราคาตั้งขาย</label><input id="f_asking" inputmode="decimal" value="${esc(c.asking_price??'')}"></div>
           <div class="field"><label>สถานะ</label><select id="f_status">${statuses.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
         </div></div>
         <div class="section"><div class="sectionTitle"><strong>เพิ่มเติม</strong></div><div class="field"><label>หมายเหตุ</label><textarea id="f_notes" rows="5" placeholder="เช่น รอเปลี่ยนยาง / เอกสารอยู่กับไฟแนนซ์">${esc(c.notes||'')}</textarea></div></div>
         <div class="section"><div class="notice">ช่องวันที่ที่เว้นว่างจะถูกบันทึกเป็น “ไม่มีข้อมูล” และจะไม่เกิด error จากค่า date ว่าง</div><div class="costSummary"><span>ต้นทุนจากข้อมูลที่บันทึก</span><b>${money(Number(c.purchase_price||0)+totalExp(c.id||''))}</b></div></div>
       </div>
     </div>
   </div>
   <div class="bottomBar"><div class="bottomInner"><button class="btn" onclick="closeEditor()">ยกเลิก</button><button class="btn primary" onclick="saveEditor()">บันทึกข้อมูล</button></div></div>
 </div>`;document.body.appendChild(m);
}
function num(id){const v=document.getElementById(id)?.value?.trim();if(v==='')return null;const n=Number(v.replace(/,/g,''));return Number.isFinite(n)?n:null}
async function saveEditor(){
 const brand=document.getElementById('f_brand').value.trim(),model=document.getElementById('f_model').value.trim();
 if(!brand||!model){toast('กรุณากรอกยี่ห้อและรุ่น');return}
 const id=editingId; const row={
  brand,model,trim:document.getElementById('f_trim').value.trim()||null,
  year:num('f_year'),plate:document.getElementById('f_plate').value.trim()||null,color:document.getElementById('f_color').value.trim()||null,
  vin:document.getElementById('f_vin').value.trim()||null,mileage:num('f_mileage'),
  purchase_date:nDate(document.getElementById('f_purchase_date').value),purchase_price:num('f_purchase_price')??0,
  ttb_price:num('f_ttb'),ttb_effective_date:nDate(document.getElementById('f_ttb_date').value),
  tisco_price:num('f_tisco'),tisco_effective_date:nDate(document.getElementById('f_tisco_date').value),
  asking_price:num('f_asking'),status:document.getElementById('f_status').value,notes:document.getElementById('f_notes').value.trim()||null,updated_by:me.id
 };
 let r=id?await sb.from('cars').update(row).eq('id',id).select().single():await sb.from('cars').insert({...row,created_by:me.id}).select().single();
 if(r.error){toast(r.error.message);console.error(r.error);return}
 await audit(r.data.id,id?'update':'create',id?'แก้ไขข้อมูลรถ':'เพิ่มรถ');
 closeEditor();await reload();openDetail(r.data.id);
 toast(id?'อัปเดตรถแล้ว':'เพิ่มรถแล้ว');
}
async function audit(entity_id,action,summary){
 try{await sb.from('audit_log').insert({entity_type:'cars',entity_id,action,summary,actor:me.id})}catch(e){}
}
function openQuick(){showQuick('quickText','เพิ่มรถแบบสั้น')}
function openQuickEdit(id){showQuick('editText','แก้ไขรถแบบสั้น',id)}
function showQuick(id,title,carId=null){
 const c=carId?byId(carId):null;
 showModal(`<div class="sheet"><button class="btn small" style="float:right" onclick="closeModal()">×</button><h2 style="margin-top:2px">${title}</h2>
 ${c?`<div class="notice">${esc(c.brand)} ${esc(c.model)} • ${esc(c.plate||'-')}</div>`:''}
 <div class="quick" style="border:1px solid var(--line);border-radius:14px;background:#fff;padding:2px 10px"><textarea id="${id}" rows="4" placeholder="${carId?'เช่น ราคาซื้อเข้า 180000\\nหรือ: เปลี่ยนสีดำ / ทะเบียน กข1234 / เพิ่มค่าซ่อม 8500':'เช่น City V 2013 ขาว กข1234 ซื้อ185000'}"></textarea></div>
 <div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="${carId?`applyQuickEdit('${carId}','${id}')`:`parseQuick('${id}')`}">วิเคราะห์และทำต่อ</button><button class="btn" onclick="voiceInput('${id}')">🎙️ พูด</button></div>
 <div id="${id}Result" style="margin-top:10px"></div></div>`)
}
function showModal(inner){closeModal();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=inner;document.body.appendChild(m)}
function closeModal(){document.getElementById('modal')?.remove()}
function parseQuick(id){
 const raw=document.getElementById(id).value.trim();if(!raw){toast('กรอกข้อความก่อน');return}
 const plate=(raw.match(/([ก-ฮ]{1,3}\\s*\\d{1,4})/)||[])[1]||'';
 const existing=plate?cars.find(c=>c.plate?.replace(/\\s/g,'')===plate.replace(/\\s/g,'')):null;
 const price=(raw.match(/(?:ซื้อ(?:เข้า)?|ทุน)\\s*([\\d,]+)/i)||[])[1];
 const year=(raw.match(/(?:19|20)\\d{2}/)||[])[0];
 const colors=['ขาว','ดำ','แดง','เทา','เงิน','น้ำเงิน','ฟ้า','เขียว','ครีม','บรอนซ์']; const color=colors.find(x=>raw.includes(x))||'';
 const models=['Yaris','City','March','D-Max','Ranger','CX-5','Civic','Jazz','Fortuner','Hilux','Vios','Almera','Navara'];
 const model=models.find(x=>raw.toLowerCase().includes(x.toLowerCase()))||'';
 let brand=['Toyota','Honda','Nissan','Isuzu','Ford','Mazda','Mitsubishi','Suzuki','MG','BYD','GWM','BMW','Mercedes','Hyundai','Kia'].find(x=>raw.toLowerCase().includes(x.toLowerCase()))||'';
 const out=document.getElementById(id+'Result');
 if(existing){out.innerHTML=`<div class="notice">พบรถเดิม <b>${esc(existing.brand)} ${esc(existing.model)}</b> ทะเบียน <b>${esc(existing.plate||'')}</b><br>ระบบจะไม่สร้างรถใหม่ คุณสามารถเปิดแก้ไขข้อมูลคันเดิมได้</div><button class="btn primary" onclick="closeModal();showEditor(byId('${existing.id}'))">เปิดแก้ไขรถคันนี้</button>`}
 else{out.innerHTML=`<div class="notice">ข้อมูลที่ตรวจพบ: <b>${esc(brand||'')}</b> <b>${esc(model||'')}</b> ${year||''} ${color||''} ${plate||''} ${price?'ซื้อ '+money(Number(price.replace(/,/g,'')))+' บาท':''}</div><button class="btn primary" onclick='closeModal();openEditor(${JSON.stringify({brand,model,year:year||'',plate:plate||'',color,purchase_price:price?Number(price.replace(/,/g,'')):null,status:"รอตรวจสภาพ"}).replace(/</g,"\\\\u003c")})'>เปิดฟอร์มตรวจสอบ</button>`}
}
async function applyQuickEdit(carId,id){
 const raw=document.getElementById(id).value.trim();if(!raw){toast('กรอกข้อความก่อน');return}
 const car=byId(carId);const patch={updated_by:me.id};let changed=false;
 const price=raw.match(/ราคาซื้อเข้า\\s*([\\d,]+)/i); if(price){patch.purchase_price=Number(price[1].replace(/,/g,''));changed=true}
 const asking=raw.match(/(?:ราคาตั้งขาย|ตั้งขาย)\\s*([\\d,]+)/i);if(asking){patch.asking_price=Number(asking[1].replace(/,/g,''));changed=true}
 const color=['ขาว','ดำ','แดง','เทา','เงิน','น้ำเงิน','ฟ้า','เขียว','ครีม','บรอนซ์'].find(x=>raw.includes(x));if(color){patch.color=color;changed=true}
 const reg=raw.match(/ทะเบียน\\s*([ก-ฮ]{1,3}\\s*\\d{1,4})/i);if(reg){patch.plate=reg[1];changed=true}
 const year=raw.match(/(?:ปี\\s*)?(19\\d{2}|20\\d{2})/i);if(year){patch.year=Number(year[1]);changed=true}
 const exp=raw.match(/เพิ่ม(?:ค่าซ่อม|ค่าใช้จ่าย)?\\s*([\\d,]+)/i);
 if(exp){const e=await sb.from('car_expenses').insert({car_id:carId,expense_type:'อื่น ๆ',amount:Number(exp[1].replace(/,/g,'')),expense_date:today(),note:'เพิ่มผ่าน Quick Edit',created_by:me.id});if(e.error){toast(e.error.message);return}changed=true}
 if(!changed){toast('ยังอ่านคำสั่งนี้ไม่ได้');return}
 const {error}=await sb.from('cars').update(patch).eq('id',carId);if(error){toast(error.message);return}
 await audit(carId,'quick_update','แก้ไขรถแบบสั้น');closeModal();await reload();openDetail(carId);toast('อัปเดตแล้ว');
}
function addExpense(id){
 showModal(`<div class="sheet"><button class="btn small" style="float:right" onclick="closeModal()">×</button><h2>เพิ่มค่าใช้จ่าย</h2><form onsubmit="saveExpense(event,'${id}')"><div class="grid">
 <div class="field"><label>รายการ</label><input name="type" placeholder="เช่น ซ่อม / ยาง / สี / โอน"></div>
 <div class="field"><label>จำนวนเงิน *</label><input name="amount" inputmode="decimal" required></div>
 <div class="field"><label>วันที่</label><input name="date" type="date" value="${today()}"></div>
 <div class="field full"><label>หมายเหตุ</label><textarea name="note" rows="3"></textarea></div>
 </div><div class="toolbar" style="margin-top:12px"><button class="btn primary">บันทึก</button><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button></div></form></div>`)
}
async function saveExpense(e,id){e.preventDefault();const f=new FormData(e.target);const amount=Number(String(f.get('amount')).replace(/,/g,''));if(!Number.isFinite(amount)){toast('จำนวนเงินไม่ถูกต้อง');return}
 const {error}=await sb.from('car_expenses').insert({car_id:id,expense_type:String(f.get('type')||'อื่น ๆ'),amount,expense_date:String(f.get('date')||today())||today(),note:String(f.get('note')||'').trim()||null,created_by:me.id});
 if(error){toast(error.message);return}await audit(id,'expense_create','เพิ่มค่าใช้จ่าย');closeModal();await reload();openDetail(id);toast('เพิ่มค่าใช้จ่ายแล้ว')}
function editValuation(id){
 const c=byId(id);showModal(`<div class="sheet"><button class="btn small" style="float:right" onclick="closeModal()">×</button><h2>อัปเดตราคากลาง</h2><div class="notice">กรอกผลที่ตรวจมาเอง ระบบจะเก็บวันที่ข้อมูลและประวัติเดิม</div><form onsubmit="saveValuation(event,'${id}')"><div class="moneyRow">
 <div class="moneyCard"><div class="moneyLabel">TTB</div><div class="field" style="margin-top:6px"><input name="ttb" inputmode="decimal" value="${esc(c.ttb_price??'')}"></div><div class="field" style="margin-top:7px"><label>ข้อมูล ณ วันที่</label><input name="ttbDate" type="date" value="${esc(c.ttb_effective_date||today())}"></div></div>
 <div class="moneyCard"><div class="moneyLabel">Tisco</div><div class="field" style="margin-top:6px"><input name="tisco" inputmode="decimal" value="${esc(c.tisco_price??'')}"></div><div class="field" style="margin-top:7px"><label>ข้อมูล ณ วันที่</label><input name="tiscoDate" type="date" value="${esc(c.tisco_effective_date||today())}"></div></div>
 </div><div class="toolbar" style="margin-top:12px"><button class="btn primary">บันทึก</button><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button></div></form></div>`)}
async function saveValuation(e,id){e.preventDefault();const f=new FormData(e.target);const t=f.get('ttb'),td=f.get('ttbDate'),x=f.get('tisco'),xd=f.get('tiscoDate');
 const patch={updated_by:me.id,ttb_price:t?Number(String(t).replace(/,/g,'')):null,ttb_effective_date:nDate(td),tisco_price:x?Number(String(x).replace(/,/g,'')):null,tisco_effective_date:nDate(xd)};
 const {error}=await sb.from('cars').update(patch).eq('id',id);if(error){toast(error.message);return}
 const rows=[];if(t)rows.push({car_id:id,institution:'TTB',price:Number(String(t).replace(/,/g,'')),effective_date:nDate(td)||today(),recorded_by:me.id});if(x)rows.push({car_id:id,institution:'Tisco',price:Number(String(x).replace(/,/g,'')),effective_date:nDate(xd)||today(),recorded_by:me.id});
 if(rows.length){const r=await sb.from('valuation_history').insert(rows);if(r.error){toast(r.error.message);return}}
 await audit(id,'valuation_update','อัปเดตราคากลาง');closeModal();await reload();openDetail(id);toast('อัปเดตราคากลางแล้ว')}
function voiceInput(targetId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('เบราว์เซอร์นี้ไม่รองรับเสียง');return}const r=new SR();r.lang='th-TH';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const id=targetId||'quickText';const el=document.getElementById(id);if(el)el.value+=(el.value?' ':'')+e.results[0][0].transcript};r.onerror=()=>toast('รับเสียงไม่สำเร็จ');r.start();toast('กำลังฟัง...')}
async function logout(){if(sb)await sb.auth.signOut();me=null;emp=null;renderLogin()}
if(sb){sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot()}else renderLogin();
</script>
</body>
